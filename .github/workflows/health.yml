# Posts the Ascendo CRM's status to #health every five minutes.
#
# GitHub's own */5 schedule is best-effort and, on a quiet repo, can go an hour
# or more without firing — which is what happened when this was first set up.
# So the timing lives inside the job instead: one run pings every five minutes
# on its own clock for just under six hours (the job limit), then starts its
# successor. The cron below is only a backstop that restarts the loop if a run
# ever dies; the concurrency group keeps it to one loop at a time, with at most
# one successor waiting.
#
# Lives in its own public repo because Actions minutes are free here and not in
# the private app repo. Nothing here is secret: the URL is public and the
# credentials are encrypted repository secrets.
name: health
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
permissions:
  actions: write
concurrency:
  group: health
  cancel-in-progress: false
jobs:
  loop:
    runs-on: ubuntu-latest
    timeout-minutes: 358
    steps:
      - name: Ping every five minutes
        env:
          HEALTH_SECRET: ${{ secrets.HEALTH_SECRET }}
          DISCORD_WEBHOOK_HEALTH: ${{ secrets.DISCORD_WEBHOOK_HEALTH }}
        run: |
          end=$(( $(date +%s) + 350*60 ))
          while [ "$(date +%s)" -lt "$end" ]; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 60 \
              -H "Authorization: Bearer $HEALTH_SECRET" \
              "https://ascendoacademy.com/api/health?post=1" || echo 000)
            echo "$(date -u +%H:%M:%S) health endpoint: $code"
            # 200 and 503 both mean the app answered and posted its own report.
            # Anything else means it could not, so say so from here instead —
            # an app that is down cannot announce that it is down.
            if [ "$code" != 200 ] && [ "$code" != 503 ]; then
              curl -s -H "Content-Type: application/json" -X POST "$DISCORD_WEBHOOK_HEALTH" \
                -d "{\"embeds\":[{\"title\":\"🔴 CRM unreachable\",\"description\":\"/api/health answered **$code** — the app could not report its own status.\",\"color\":14239035}]}" || true
            fi
            # Sleep to the next five-minute mark, so a slow check does not drift.
            sleep $(( 300 - $(date +%s) % 300 ))
          done
      - name: Start the next loop
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run health.yml -R "${{ github.repository }}"
